app-id: org.crossscp.CrossSCP
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: CrossSCP
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
modules:
  - name: crossscp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCROSSSCP_BUILD_GUI=ON
      - -DCROSSSCP_GUI_BUILD_RUST_CLI=OFF
    sources:
      - type: dir
        path: ../../..
