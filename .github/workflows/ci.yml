name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: Rust validation
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust fmt
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --workspace
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: SFTP ssh2 backend check
        run: cargo check -p crossscp-protocol-sftp --features ssh2-backend

  cmake-skeleton:
    name: CMake package skeleton
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure package skeleton without Qt
        run: cmake -S . -B build/package-check
