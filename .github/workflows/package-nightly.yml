name: Package Nightly

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      package:
        description: Package target to build
        type: choice
        default: all
        options:
          - all
          - macos
          - windows
          - linux

permissions:
  contents: read

concurrency:
  group: package-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-dmg:
    name: macOS unsigned DMG smoke test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.package == 'all' || inputs.package == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
      - name: Install DMG helper
        run: brew install create-dmg
      - name: Export release metadata
        run: scripts/release-metadata.sh macos arm64
      - name: Build macOS DMG
        run: |
          BUILD_DIR=build/gui-release \
          DIST_DIR="$CROSSSCP_DIST_DIR" \
          DMG_PATH="$CROSSSCP_DIST_DIR/$CROSSSCP_ARTIFACT_BASE.dmg" \
          QT_BIN_DIR="$QT_ROOT_DIR/bin" \
          bash scripts/package-gui.sh
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CROSSSCP_ARTIFACT_BASE }}
          path: |
            ${{ env.CROSSSCP_DIST_DIR }}/*.dmg
            ${{ env.CROSSSCP_DIST_DIR }}/*.sha256

  windows-zip:
    name: Windows setup EXE and portable ZIP smoke test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.package == 'all' || inputs.package == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
      - name: Install NSIS
        run: choco install nsis -y
      - name: Export release metadata
        shell: bash
        run: scripts/release-metadata.sh windows x64
      - name: Configure GUI
        run: cmake -S . -B build/gui-release -DCROSSSCP_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build GUI
        run: cmake --build build/gui-release --config Release
      - name: Deploy Qt runtime
        shell: pwsh
        run: scripts/deploy-windows.ps1 -BuildDir build/gui-release -QtBinDir "$env:QT_ROOT_DIR/bin"
      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:CROSSSCP_DIST_DIR | Out-Null
          $deployDir = "build/gui-release/apps/crossscp-gui/Release"
          Compress-Archive -Path "$deployDir/*" -DestinationPath "$env:CROSSSCP_DIST_DIR/$env:CROSSSCP_ARTIFACT_BASE-portable.zip" -Force
      - name: Build setup EXE
        shell: pwsh
        run: |
          $deployDir = (Resolve-Path "build/gui-release/apps/crossscp-gui/Release").Path
          $outFile = "$env:GITHUB_WORKSPACE/$env:CROSSSCP_DIST_DIR/$env:CROSSSCP_ARTIFACT_BASE-setup.exe"
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) { $makensis = "makensis.exe" }
          & $makensis "/DVERSION=$env:CROSSSCP_VERSION" "/DDEPLOY_DIR=$deployDir" "/DOUT_FILE=$outFile" packaging/windows/crossscp.nsi.in
      - name: Generate checksums
        shell: bash
        run: scripts/checksum-artifacts.sh "$CROSSSCP_DIST_DIR"
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CROSSSCP_ARTIFACT_BASE }}
          path: |
            ${{ env.CROSSSCP_DIST_DIR }}/*.zip
            ${{ env.CROSSSCP_DIST_DIR }}/*.exe
            ${{ env.CROSSSCP_DIST_DIR }}/*.sha256

  ubuntu-deb:
    name: Ubuntu DEB smoke test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.package == 'all' || inputs.package == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Qt packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libssl-dev zlib1g-dev qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-tools-dev-tools libgl1-mesa-dev libxkbcommon-dev
      - name: Export release metadata
        run: scripts/release-metadata.sh ubuntu amd64
      - name: Configure GUI DEB package
        run: cmake -S . -B build/ubuntu-deb -G Ninja -DCROSSSCP_BUILD_GUI=ON -DCROSSSCP_PACKAGE_DEB=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build DEB package
        run: cmake --build build/ubuntu-deb --target package --config Release
      - name: Collect DEB package
        run: |
          mkdir -p "$CROSSSCP_DIST_DIR"
          find build/ubuntu-deb -maxdepth 1 -type f -name '*.deb' -exec cp {} "$CROSSSCP_DIST_DIR/$CROSSSCP_ARTIFACT_BASE.deb" \;
          scripts/checksum-artifacts.sh "$CROSSSCP_DIST_DIR"
      - name: Upload Ubuntu DEB package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CROSSSCP_ARTIFACT_BASE }}
          path: |
            ${{ env.CROSSSCP_DIST_DIR }}/*.deb
            ${{ env.CROSSSCP_DIST_DIR }}/*.sha256

  flatpak:
    name: Flatpak bundle smoke test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.package == 'all' || inputs.package == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.kde.Platform//6.7 org.kde.Sdk//6.7
      - name: Export release metadata
        run: CROSSSCP_ARTIFACT_OS=linux scripts/release-metadata.sh flatpak x86_64
      - name: Build Flatpak bundle
        run: |
          mkdir -p "$CROSSSCP_DIST_DIR"
          flatpak-builder --force-clean --repo=build/flatpak-repo build/flatpak packaging/linux/flatpak/org.crossscp.CrossSCP.yml
          flatpak build-bundle build/flatpak-repo "$CROSSSCP_DIST_DIR/$CROSSSCP_ARTIFACT_BASE.flatpak" org.crossscp.CrossSCP
          scripts/checksum-artifacts.sh "$CROSSSCP_DIST_DIR"
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CROSSSCP_ARTIFACT_BASE }}
          path: |
            ${{ env.CROSSSCP_DIST_DIR }}/*.flatpak
            ${{ env.CROSSSCP_DIST_DIR }}/*.sha256
