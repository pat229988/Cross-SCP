name: Auto Tag Release

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: auto-tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Create release tag from VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semver tag like v1.0.1. Found: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing
        id: create
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          git fetch origin "refs/tags/${version}:refs/tags/${version}" || true
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "Tag ${version} already exists; no new release tag needed."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Release ${version}"
          git push origin "$version"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch tagged release workflows
        if: ${{ steps.create.outputs.created == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh workflow run package-nightly.yml --ref "$version" -f package=all
