name: Release Windows

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows setup EXE and portable ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
      - name: Install NSIS
        run: choco install nsis -y
      - name: Require signing certificate for tag releases
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          WINDOWS_CODE_SIGN_CERT_PFX: ${{ secrets.WINDOWS_CODE_SIGN_CERT_PFX }}
          WINDOWS_CODE_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_CERT_PASSWORD }}
          CROSSSCP_SIGN_CERT_THUMBPRINT: ${{ secrets.CROSSSCP_SIGN_CERT_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGN_CERT_PFX) -and [string]::IsNullOrWhiteSpace($env:CROSSSCP_SIGN_CERT_THUMBPRINT)) {
            throw "Tagged Windows releases must be Authenticode signed. Configure WINDOWS_CODE_SIGN_CERT_PFX + WINDOWS_CODE_SIGN_CERT_PASSWORD, or CROSSSCP_SIGN_CERT_THUMBPRINT on a runner with the certificate installed."
          }
      - name: Decode Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CODE_SIGN_CERT_PFX: ${{ secrets.WINDOWS_CODE_SIGN_CERT_PFX }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGN_CERT_PFX)) {
            Write-Host "Skipping PFX decode: WINDOWS_CODE_SIGN_CERT_PFX is not configured."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "crossscp-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODE_SIGN_CERT_PFX))
          "CROSSSCP_WINDOWS_PFX_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Export release metadata
        shell: bash
        run: scripts/release-metadata.sh windows x64
      - name: Configure GUI
        run: cmake -S . -B build/gui-release -DCROSSSCP_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build GUI
        run: cmake --build build/gui-release --config Release
      - name: Deploy Qt runtime
        shell: pwsh
        env:
          CROSSSCP_SIGN_CERT_THUMBPRINT: ${{ secrets.CROSSSCP_SIGN_CERT_THUMBPRINT }}
          WINDOWS_CODE_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_CERT_PASSWORD }}
        run: scripts/deploy-windows.ps1 -BuildDir build/gui-release -QtBinDir "$env:QT_ROOT_DIR/bin"
      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:CROSSSCP_DIST_DIR | Out-Null
          $deployDir = "build/gui-release/apps/crossscp-gui/Release"
          Compress-Archive -Path "$deployDir/*" -DestinationPath "$env:CROSSSCP_DIST_DIR/$env:CROSSSCP_ARTIFACT_BASE-portable.zip" -Force
      - name: Build setup EXE
        shell: pwsh
        run: |
          $deployDir = (Resolve-Path "build/gui-release/apps/crossscp-gui/Release").Path
          $outFile = "$env:GITHUB_WORKSPACE/$env:CROSSSCP_DIST_DIR/$env:CROSSSCP_ARTIFACT_BASE-setup.exe"
          $licenseFile = "$env:GITHUB_WORKSPACE/LICENSE"
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) { $makensis = "makensis.exe" }
          & $makensis "/DVERSION=$env:CROSSSCP_VERSION" "/DDEPLOY_DIR=$deployDir" "/DOUT_FILE=$outFile" "/DLICENSE_FILE=$licenseFile" packaging/windows/crossscp.nsi.in
      - name: Sign setup EXE
        shell: pwsh
        env:
          CROSSSCP_SIGN_CERT_THUMBPRINT: ${{ secrets.CROSSSCP_SIGN_CERT_THUMBPRINT }}
          WINDOWS_CODE_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_CERT_PASSWORD }}
        run: scripts/sign-windows.ps1 -FilePath "$env:CROSSSCP_DIST_DIR/$env:CROSSSCP_ARTIFACT_BASE-setup.exe"
      - name: Generate checksums
        shell: bash
        run: scripts/checksum-artifacts.sh "$CROSSSCP_DIST_DIR"
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CROSSSCP_ARTIFACT_BASE }}
          path: |
            ${{ env.CROSSSCP_DIST_DIR }}/*.zip
            ${{ env.CROSSSCP_DIST_DIR }}/*.exe
            ${{ env.CROSSSCP_DIST_DIR }}/*.sha256
      - name: Upload to GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ env.CROSSSCP_DIST_DIR }}/*.zip
            ${{ env.CROSSSCP_DIST_DIR }}/*.exe
            ${{ env.CROSSSCP_DIST_DIR }}/*.sha256
