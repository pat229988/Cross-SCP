name: GUI Package Skeleton

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-gui:
    name: Package GUI skeleton
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Qt 6.7's official macOS binaries still link the legacy AGL framework,
        # which is absent from the macOS 26/Xcode 26 SDK currently used by
        # macos-latest. Pin macOS GUI packaging to macOS 15 until the Qt
        # toolchain is upgraded.
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
      - name: Configure GUI
        run: cmake -S . -B build/gui -DCROSSSCP_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build GUI
        run: cmake --build build/gui --config Release
      - name: Package GUI
        run: cmake --build build/gui --target package --config Release
