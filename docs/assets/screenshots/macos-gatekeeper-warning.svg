<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">macOS Gatekeeper warning illustration</title>
  <desc id="desc">Illustrative macOS warning dialog showing Move to Trash and Done buttons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#253247"/></linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f9fafb"/><stop offset="1" stop-color="#e5e7eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000" flood-opacity="0.38"/></filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="250" cy="160" r="210" fill="#38bdf8" opacity="0.12"/>
  <circle cx="960" cy="120" r="260" fill="#8b5cf6" opacity="0.12"/>
  <g filter="url(#shadow)">
    <rect x="310" y="145" width="580" height="470" rx="28" fill="url(#panel)"/>
    <circle cx="600" cy="235" r="44" fill="#d1d5db"/>
    <path d="M578 252c18-42 26-63 25-85 25 11 40 34 39 62-1 31-21 55-64 23z" fill="#6b7280" opacity="0.7"/>
    <text x="600" y="330" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="700" fill="#111827">“CrossSCP” can’t be opened</text>
    <text x="600" y="373" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#374151">Apple cannot check it for malicious software.</text>
    <text x="600" y="406" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" fill="#6b7280">This is expected for unsigned beta builds.</text>
    <rect x="390" y="505" width="190" height="48" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="485" y="536" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" fill="#111827">Move to Trash</text>
    <rect x="620" y="505" width="190" height="48" rx="12" fill="#2563eb"/>
    <text x="715" y="536" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#fff">Done</text>
  </g>
</svg>
